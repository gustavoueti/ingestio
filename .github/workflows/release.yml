name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write 
      id-token: write
      
    environment:
      name: pypi
      url: https://pypi.org/p/ingestio

    steps:
      # No `ref:` here on purpose: checking out a SHA gives a detached HEAD, and
      # semantic-release needs to be on a branch to match its release groups.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The build runs inside this action's container, not on the runner: uv is
      # installed by the build_command in pyproject.toml.
      - name: Version, tag and build
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Summary
        if: steps.release.outputs.released == 'true'
        run: |
          echo "Released ${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.release.outputs.link }}" >> "$GITHUB_STEP_SUMMARY"
