[project]
name = "ingestio"
description = "Small, composable library for building data ingestion pipelines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Gustavo Ueti", email = "gustavo.ueti@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]

# Engine dependencies, when they arrive, go in extras: the core stays installable anywhere.
dependencies = []

# One extra per integrated system. Engines the runtime provides, such as pyspark on Databricks,
# are prerequisites, never dependencies: pip-installing pyspark over a runtime breaks it.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
bigquery = ["google-cloud-bigquery>=3.20"]
databricks = ["databricks-sdk>=0.20"]
gcs = ["google-cloud-storage>=2.10"]
s3 = ["boto3>=1.34"]

[project.urls]
Repository = "https://github.com/gustavoueti/ingestio"

# PEP 735: development dependencies. Not published with the package and not installable as
# consumer-facing extras — `uv sync` installs them by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # The packages of every extra, plus the engines they assume, so that the whole suite and
    # mypy run after `uv sync`.
    "psycopg[binary]>=3.2",
    "pyspark>=3.5",
    "boto3>=1.34",
    "boto3-stubs[s3]>=1.34",
    "google-cloud-bigquery>=3.20",
    "databricks-sdk>=0.20",
    "google-cloud-storage>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ingestio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestio"]

# ---------------------------------------------------------------------------
# ruff — lint + format (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Documentation examples are written for readability, not for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez  — enforces timezone-aware timestamps
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in tests
# N818 wants an `Error` suffix. The cancel exceptions are control flow, not failures.
"src/ingestio/callback/core.py" = ["N818"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that touch an external resource (network, heavy disk, engine)",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# google-cloud-storage ships no py.typed marker and has no stubs package.
[[tool.mypy.overrides]]
module = ["google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# python-semantic-release
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_variables = ["src/ingestio/__init__.py:__version__"]
# The release action runs semantic-release in its own Docker container, which
# has Python and pip but not uv, so the build installs uv first.
build_command = "python -m pip install uv && uv build"
commit_message = "chore(release): v{version}"
# Both differ from the defaults: without them the first automated release
# would jump straight to 1.0.0.
allow_zero_version = true
major_on_zero = false
